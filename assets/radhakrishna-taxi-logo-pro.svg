<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a1a" stroke="#f97316" stroke-width="3"/>
  
  <!-- Car body -->
  <g transform="translate(100, 100)">
    <!-- Main car body -->
    <ellipse cx="0" cy="8" rx="35" ry="22" fill="#f97316"/>
    
    <!-- Car top/cabin -->
    <rect x="-22" y="-8" width="44" height="18" rx="4" fill="#f97316"/>
    
    <!-- Windows -->
    <rect x="-18" y="-4" width="12" height="10" rx="1" fill="#87ceeb" opacity="0.6"/>
    <rect x="6" y="-4" width="12" height="10" rx="1" fill="#87ceeb" opacity="0.6"/>
    
    <!-- Left wheel -->
    <circle cx="-20" cy="28" r="8" fill="#333"/>
    <circle cx="-20" cy="28" r="5" fill="#666"/>
    <circle cx="-20" cy="28" r="2" fill="#999"/>
    
    <!-- Right wheel -->
    <circle cx="20" cy="28" r="8" fill="#333"/>
    <circle cx="20" cy="28" r="5" fill="#666"/>
    <circle cx="20" cy="28" r="2" fill="#999"/>
    
    <!-- Headlights -->
    <circle cx="-28" cy="4" r="3" fill="#ffff00" opacity="0.8"/>
    <circle cx="28" cy="4" r="3" fill="#ffff00" opacity="0.8"/>
    
    <!-- Taxi roof indicator -->
    <rect x="-8" y="-20" width="16" height="6" fill="#f97316"/>
    <text x="0" y="-12" font-size="8" fill="white" text-anchor="middle" font-weight="bold">TAXI</text>
  </g>
</svg>